[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "point-affinity-transformer"
dynamic = ["version"]
description = "Point Affinity Transformers for global neuron shape reasoning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Jakob Troidl" }]
keywords = ["connectomics", "neuron", "point cloud", "transformer", "segmentation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.1",
    "numpy",
    "scikit-learn>=1.2",
    "safetensors>=0.4",
]

[project.optional-dependencies]
swc = ["navis>=1.4"]
pretrained = ["gdown>=5"]
train = ["navis>=1.4", "pandas", "pyyaml", "tqdm"]
wandb = ["wandb"]
docs = ["mkdocs-material>=9", "mkdocstrings[python]>=0.24", "mkdocs-jupyter>=0.24"]
dev = ["pytest", "ruff", "timm", "einops", "python-voi"]  # the last three for comparing against research/legacy

[project.scripts]
pat = "pat.cli:main"

[project.urls]
Paper = "https://www.biorxiv.org/content/10.1101/2024.11.24.625067v1"
Source = "https://github.com/jakobtroidl/neuron-shape-reasoning"

[tool.hatch.version]
path = "src/pat/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pat"]

[tool.hatch.build.targets.sdist]
include = ["src/pat", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
